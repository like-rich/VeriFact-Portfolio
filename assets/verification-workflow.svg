<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">VeriFact AI verification workflow</title>
  <desc id="desc">An eight-stage workflow from multimodal input through preprocessing, claim decomposition, evidence retrieval, parallel model verification, weighted consensus, explainable reporting, and human review.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#315b7d"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#15324b" flood-opacity="0.12"/>
    </filter>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #173957; }
      .subtitle { font-size: 17px; font-weight: 400; fill: #526b80; }
      .stage { font-size: 19px; font-weight: 700; fill: #173957; }
      .detail { font-size: 15px; font-weight: 400; fill: #405a70; }
      .number { font-size: 16px; font-weight: 700; fill: white; text-anchor: middle; dominant-baseline: middle; }
      .lane { font-size: 15px; font-weight: 700; fill: #315b7d; letter-spacing: 1px; }
      .small { font-size: 13px; font-weight: 400; fill: #60788c; }
      .arrow { stroke: #315b7d; stroke-width: 3; fill: none; }
      .dash { stroke: #b77719; stroke-width: 3; stroke-dasharray: 9 7; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="760" fill="#f8fbfe"/>
  <text x="800" y="58" class="title" text-anchor="middle">VeriFact AI Verification Workflow</text>
  <text x="800" y="88" class="subtitle" text-anchor="middle">Evidence-first reasoning, cross-model consensus, and human quality control</text>

  <text x="60" y="144" class="lane">INPUT AND NORMALISATION</text>
  <line x1="60" y1="157" x2="1540" y2="157" stroke="#d8e4ee" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="60" y="190" width="270" height="145" rx="18" fill="#ffffff" stroke="#7aa2c4" stroke-width="2"/>
    <circle cx="92" cy="220" r="18" fill="#315b7d"/><text x="92" y="220" class="number">1</text>
    <text x="125" y="226" class="stage">Multimodal input</text>
    <text x="86" y="263" class="detail">Text · image · audio · video</text>
    <text x="86" y="288" class="detail">URL · supported online video</text>
    <text x="86" y="313" class="small">Guest and authenticated modes</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="390" y="190" width="300" height="145" rx="18" fill="#eaf4fb" stroke="#5d91ba" stroke-width="2"/>
    <circle cx="422" cy="220" r="18" fill="#315b7d"/><text x="422" y="220" class="number">2</text>
    <text x="455" y="226" class="stage">Preprocess and enrich</text>
    <text x="416" y="263" class="detail">Transcript · key frames · metadata</text>
    <text x="416" y="288" class="detail">Provenance · cross-modal signals</text>
    <text x="416" y="313" class="small">Normalised claim text + media report</text>
  </g>

  <line x1="330" y1="262" x2="378" y2="262" stroke="#315b7d" stroke-width="3"/>
  <polygon points="390,262 378,255 378,269" fill="#315b7d"/>

  <g filter="url(#shadow)">
    <rect x="750" y="190" width="300" height="145" rx="18" fill="#eaf4fb" stroke="#5d91ba" stroke-width="2"/>
    <circle cx="782" cy="220" r="18" fill="#315b7d"/><text x="782" y="220" class="number">3</text>
    <text x="815" y="226" class="stage">Claim decomposition</text>
    <text x="776" y="263" class="detail">Extract 1–5 independent facts</text>
    <text x="776" y="288" class="detail">Keep each claim searchable</text>
    <text x="776" y="313" class="small">Structured output validation</text>
  </g>

  <line x1="690" y1="262" x2="738" y2="262" stroke="#315b7d" stroke-width="3"/>
  <polygon points="750,262 738,255 738,269" fill="#315b7d"/>

  <g filter="url(#shadow)">
    <rect x="1110" y="190" width="430" height="145" rx="18" fill="#fff6e7" stroke="#ca8a2b" stroke-width="2"/>
    <circle cx="1142" cy="220" r="18" fill="#b77719"/><text x="1142" y="220" class="number">4</text>
    <text x="1175" y="226" class="stage">Evidence retrieval and quality</text>
    <text x="1136" y="263" class="detail">Parallel multi-query search · URL extraction</text>
    <text x="1136" y="288" class="detail">Credibility labels · relevance checks · retry</text>
    <text x="1136" y="313" class="small">No usable evidence — explicit uncertainty</text>
  </g>

  <line x1="1050" y1="262" x2="1098" y2="262" stroke="#315b7d" stroke-width="3"/>
  <polygon points="1110,262 1098,255 1098,269" fill="#315b7d"/>

  <text x="60" y="402" class="lane">ASSESSMENT, CONSENSUS, AND FEEDBACK</text>
  <line x1="60" y1="415" x2="1540" y2="415" stroke="#d8e4ee" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="60" y="450" width="340" height="160" rx="18" fill="#f2edfb" stroke="#8469b3" stroke-width="2"/>
    <circle cx="92" cy="480" r="18" fill="#6d52a3"/><text x="92" y="480" class="number">5</text>
    <text x="125" y="486" class="stage">Parallel model verification</text>
    <text x="86" y="523" class="detail">Same claim and evidence per provider</text>
    <text x="86" y="548" class="detail">Verdict · confidence · reasoning · sources</text>
    <text x="86" y="573" class="small">Provider failure remains observable</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="460" y="450" width="310" height="160" rx="18" fill="#eaf4fb" stroke="#5d91ba" stroke-width="2"/>
    <circle cx="492" cy="480" r="18" fill="#315b7d"/><text x="492" y="480" class="number">6</text>
    <text x="525" y="486" class="stage">Weighted consensus</text>
    <text x="486" y="523" class="detail">Capability-weighted voting</text>
    <text x="486" y="548" class="detail">Supermajority · disagreement penalty</text>
    <text x="486" y="573" class="small">Supported · Refuted · Uncertain</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="830" y="450" width="300" height="160" rx="18" fill="#e9f6ee" stroke="#4c8a61" stroke-width="2"/>
    <circle cx="862" cy="480" r="18" fill="#3f7b55"/><text x="862" y="480" class="number">7</text>
    <text x="895" y="486" class="stage">Explainable report</text>
    <text x="856" y="523" class="detail">Per-claim evidence and reasoning</text>
    <text x="856" y="548" class="detail">Final verdict and confidence</text>
    <text x="856" y="573" class="small">SSE progress + auditable result</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1190" y="450" width="350" height="160" rx="18" fill="#fff1ed" stroke="#bd6b56" stroke-width="2"/>
    <circle cx="1222" cy="480" r="18" fill="#a95745"/><text x="1222" y="480" class="number">8</text>
    <text x="1255" y="486" class="stage">Human review loop</text>
    <text x="1216" y="523" class="detail">Low confidence · conflict · random audit</text>
    <text x="1216" y="548" class="detail">Ground truth · error category · notes</text>
    <text x="1216" y="573" class="small">Calibration and performance analytics</text>
  </g>

  <line x1="1325" y1="335" x2="1325" y2="370" stroke="#315b7d" stroke-width="3"/>
  <line x1="1325" y1="370" x2="230" y2="370" stroke="#315b7d" stroke-width="3"/>
  <line x1="230" y1="370" x2="230" y2="438" stroke="#315b7d" stroke-width="3"/>
  <polygon points="230,450 223,438 237,438" fill="#315b7d"/>
  <line x1="400" y1="530" x2="448" y2="530" stroke="#315b7d" stroke-width="3"/>
  <polygon points="460,530 448,523 448,537" fill="#315b7d"/>
  <line x1="770" y1="530" x2="818" y2="530" stroke="#315b7d" stroke-width="3"/>
  <polygon points="830,530 818,523 818,537" fill="#315b7d"/>
  <line x1="1130" y1="530" x2="1178" y2="530" stroke="#b77719" stroke-width="3" stroke-dasharray="9 7"/>
  <polygon points="1190,530 1178,523 1178,537" fill="#b77719"/>

  <rect x="60" y="666" width="1480" height="50" rx="12" fill="#eef4f8"/>
  <circle cx="88" cy="691" r="6" fill="#315b7d"/>
  <text x="108" y="696" class="small">Solid blue: automated processing</text>
  <line x1="360" y1="691" x2="416" y2="691" stroke="#b77719" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="432" y="696" class="small">Dashed amber: quality-control handoff</text>
  <text x="1510" y="696" class="small" text-anchor="end">Source code remains in the private UNSW team repository</text>
</svg>
