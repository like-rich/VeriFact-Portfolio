<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
  <defs>
    <marker id="arrow" viewBox="0 0 10 6" markerWidth="10" markerHeight="6" refX="9" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,6 L9,3 z" fill="#315b7d"/></marker>
    <marker id="arrow2" viewBox="0 0 10 6" markerWidth="10" markerHeight="6" refX="9" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,6 L9,3 z" fill="#8a5a20"/></marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#183b5b}.subtitle{font:16px Arial,sans-serif;fill:#536779}
      .group{fill:#f8fbfd;stroke:#7894aa;stroke-width:2;rx:18}.groupTitle{font:700 20px Arial,sans-serif;fill:#234f73}
      .box{fill:#fff;stroke:#477493;stroke-width:2;rx:10}.accent{fill:#dcecf7;stroke:#477493;stroke-width:2;rx:10}
      .service{fill:#eef6fb;stroke:#6b8da5;stroke-width:1.7;rx:9}.external{fill:#fff8eb;stroke:#b47a2a;stroke-width:2;rx:10}
      .data{fill:#eef8ef;stroke:#4f8058;stroke-width:2;rx:10}.label{font:700 16px Arial,sans-serif;fill:#173c58;text-anchor:middle}
      .small{font:14px Arial,sans-serif;fill:#364d5d;text-anchor:middle}.tiny{font:12px Arial,sans-serif;fill:#465d6c;text-anchor:middle}
      .arrow{fill:none;stroke:#315b7d;stroke-width:2.2;marker-end:url(#arrow)}.bi{fill:none;stroke:#315b7d;stroke-width:2.2;marker-start:url(#arrow);marker-end:url(#arrow)}
      .extArrow{fill:none;stroke:#8a5a20;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrow2)}
      .flowLabel{font:12px Arial,sans-serif;fill:#315b7d;text-anchor:middle}.extLabel{font:12px Arial,sans-serif;fill:#7b4d18;text-anchor:middle}.legend{font:14px Arial,sans-serif;fill:#364d5d;text-anchor:start}
    </style>
  </defs>
  <rect width="1800" height="1100" fill="#ffffff"/>
  <text x="900" y="43" class="title" text-anchor="middle">VeriFact Final System Architecture</text>
  <text x="900" y="70" class="subtitle" text-anchor="middle">Principal components, module interactions, and labelled data flows</text>

  <rect x="35" y="110" width="220" height="360" class="group"/>
  <text x="145" y="145" class="groupTitle" text-anchor="middle">Actors</text>
  <rect x="65" y="175" width="160" height="65" class="box"/><text x="145" y="205" class="label">Guest / User</text><text x="145" y="225" class="tiny">submit and view claims</text>
  <rect x="65" y="270" width="160" height="65" class="box"/><text x="145" y="300" class="label">Reviewer</text><text x="145" y="320" class="tiny">review and analytics</text>
  <rect x="65" y="365" width="160" height="65" class="box"/><text x="145" y="395" class="label">Administrator</text><text x="145" y="415" class="tiny">users, content, audit</text>

  <rect x="300" y="110" width="285" height="610" class="group"/>
  <text x="442" y="145" class="groupTitle" text-anchor="middle">React / Vite Frontend</text>
  <rect x="335" y="175" width="215" height="70" class="accent"/><text x="442" y="205" class="label">Browser SPA</text><text x="442" y="225" class="tiny">routing and application state</text>
  <rect x="335" y="275" width="215" height="60" class="box"/><text x="442" y="303" class="label">Workspace</text><text x="442" y="322" class="tiny">composer and report view</text>
  <rect x="335" y="360" width="215" height="60" class="box"/><text x="442" y="388" class="label">Authentication UI</text><text x="442" y="407" class="tiny">register, login, recovery</text>
  <rect x="335" y="445" width="215" height="60" class="box"/><text x="442" y="473" class="label">Reviewer UI</text><text x="442" y="492" class="tiny">queue, history, analytics</text>
  <rect x="335" y="530" width="215" height="60" class="box"/><text x="442" y="558" class="label">Admin UI</text><text x="442" y="577" class="tiny">management and monitoring</text>
  <rect x="335" y="615" width="215" height="70" class="service"/><text x="442" y="643" class="label">API Client</text><text x="442" y="663" class="tiny">Axios, JWT, REST, multipart</text><text x="442" y="679" class="tiny">and SSE event handling</text>

  <rect x="640" y="110" width="680" height="880" class="group"/>
  <text x="980" y="145" class="groupTitle" text-anchor="middle">FastAPI Backend</text>
  <rect x="685" y="175" width="590" height="65" class="accent"/><text x="980" y="202" class="label">API Gateway and Middleware</text><text x="980" y="222" class="small">CORS · rate limiting · access logging · exception handling</text>

  <text x="680" y="275" class="small" text-anchor="start">Routers</text>
  <rect x="685" y="290" width="130" height="70" class="box"/><text x="750" y="320" class="label">Auth</text><text x="750" y="341" class="tiny">/auth</text>
  <rect x="825" y="290" width="130" height="70" class="box"/><text x="890" y="320" class="label">Verify</text><text x="890" y="341" class="tiny">/verify</text>
  <rect x="965" y="290" width="145" height="70" class="box"/><text x="1037" y="320" class="label">Reviewer</text><text x="1037" y="341" class="tiny">/reviewer</text>
  <rect x="1120" y="290" width="155" height="70" class="box"/><text x="1197" y="320" class="label">Admin</text><text x="1197" y="341" class="tiny">/admin</text>

  <text x="680" y="400" class="small" text-anchor="start">Business services</text>
  <rect x="685" y="415" width="130" height="75" class="service"/><text x="750" y="445" class="label">Auth</text><text x="750" y="466" class="tiny">accounts and RBAC</text>
  <rect x="825" y="415" width="130" height="75" class="service"/><text x="890" y="445" class="label">Verification</text><text x="890" y="466" class="tiny">workflow orchestration</text>
  <rect x="965" y="415" width="145" height="75" class="service"/><text x="1037" y="445" class="label">Review</text><text x="1037" y="466" class="tiny">queue and decisions</text>
  <rect x="1120" y="415" width="155" height="75" class="service"/><text x="1197" y="445" class="label">Administration</text><text x="1197" y="466" class="tiny">users, claims, audit</text>

  <text x="680" y="535" class="small" text-anchor="start">Verification subsystems</text>
  <rect x="700" y="550" width="270" height="125" class="accent"/><text x="835" y="580" class="label">AI Agent Pipeline</text><text x="835" y="604" class="small">claim decomposition</text><text x="835" y="625" class="small">evidence retrieval</text><text x="835" y="646" class="small">parallel model assessment</text><text x="835" y="667" class="small">weighted consensus</text>
  <rect x="995" y="550" width="270" height="125" class="accent"/><text x="1130" y="580" class="label">Media Pipeline</text><text x="1130" y="604" class="small">transcription and frames</text><text x="1130" y="625" class="small">metadata and provenance</text><text x="1130" y="646" class="small">cross-modal analysis</text><text x="1130" y="667" class="small">temporary-file cleanup</text>

  <rect x="700" y="720" width="565" height="70" class="service"/><text x="982" y="748" class="label">Repository Layer</text><text x="982" y="770" class="small">users · claims · reviews · invitations · AI usage · audit records</text>
  <rect x="700" y="835" width="565" height="70" class="service"/><text x="982" y="863" class="label">SQLAlchemy Models and Alembic</text><text x="982" y="885" class="small">relational entities and versioned schema migrations</text>

  <rect x="1370" y="110" width="395" height="880" class="group"/>
  <text x="1567" y="145" class="groupTitle" text-anchor="middle">Data and Integrations</text>
  <rect x="1410" y="175" width="315" height="80" class="external"/><text x="1567" y="205" class="label">Resend Email API</text><text x="1567" y="226" class="tiny">activation · password reset</text><text x="1567" y="243" class="tiny">reviewer invitations</text>
  <rect x="1410" y="300" width="315" height="90" class="external"/><text x="1567" y="330" class="label">LLM Providers</text><text x="1567" y="352" class="tiny">structured prompts</text><text x="1567" y="370" class="tiny">verdicts · reasoning · confidence</text>
  <rect x="1410" y="435" width="315" height="85" class="external"/><text x="1567" y="465" class="label">Evidence Search</text><text x="1567" y="487" class="tiny">Tavily API</text><text x="1567" y="505" class="tiny">DuckDuckGo fallback</text>
  <rect x="1410" y="565" width="315" height="95" class="external"/><text x="1567" y="595" class="label">Local Media Tools</text><text x="1567" y="617" class="tiny">FFmpeg / FFprobe · Whisper</text><text x="1567" y="637" class="tiny">ExifTool · yt-dlp · optional C2PA</text>
  <rect x="1410" y="710" width="315" height="95" class="data"/><text x="1567" y="743" class="label">PostgreSQL 16</text><text x="1567" y="765" class="tiny">accounts · claims · results · reviews</text><text x="1567" y="784" class="tiny">usage metrics · audit logs</text>
  <rect x="1410" y="850" width="315" height="90" class="data"/><text x="1567" y="882" class="label">Local File Storage</text><text x="1567" y="904" class="tiny">uploads · temporary artefacts</text><text x="1567" y="922" class="tiny">controlled cleanup</text>

  <path d="M225 208 H335" class="arrow"/><text x="280" y="194" class="flowLabel">browser actions</text>
  <path d="M225 303 H270 V475 H335" class="arrow"/><path d="M225 398 H280 V560 H335" class="arrow"/>
  <path d="M550 650 H620 V207 H685" class="arrow"/><text x="614" y="397" class="flowLabel" transform="rotate(-90 614 397)">REST JSON · multipart · JWT</text>
  <path d="M685 225 H635 V675 H550" class="arrow"/><text x="640" y="470" class="flowLabel" transform="rotate(-90 640 470)">SSE progress · JSON results</text>
  <path d="M750 240 V290 M890 240 V290 M1037 240 V290 M1197 240 V290" class="arrow"/>
  <path d="M750 360 V415 M890 360 V415 M1037 360 V415 M1197 360 V415" class="arrow"/>
  <path d="M890 490 V520 H835 V550" class="arrow"/><text x="850" y="517" class="flowLabel">claims + evidence</text>
  <path d="M900 490 V525 H1130 V550" class="arrow"/><text x="1060" y="519" class="flowLabel">media jobs</text>
  <path d="M750 490 V700 H790 V720 M1037 490 V700 H955 V720 M1197 490 V700 H1135 V720 M890 675 V720" class="arrow"/>
  <path d="M982 790 V835" class="arrow"/><text x="1015" y="818" class="flowLabel">ORM operations</text>
  <path d="M1265 870 H1345 V757 H1410" class="bi"/><text x="1350" y="795" class="flowLabel" transform="rotate(-90 1350 795)">SQL queries / persisted records</text>
  <path d="M815 452 H1345 V215 H1410" class="extArrow"/><text x="1350" y="330" class="extLabel" transform="rotate(-90 1350 330)">email requests</text>
  <path d="M970 600 H1360 V345 H1410" class="extArrow"/><text x="1370" y="367" class="extLabel">prompts / assessments</text>
  <path d="M970 635 H1368 V477 H1410" class="extArrow"/><text x="1370" y="500" class="extLabel">queries / evidence</text>
  <path d="M1265 615 H1410" class="extArrow"/><text x="1338" y="601" class="extLabel">media / extracted data</text>
  <path d="M1130 675 V930 H1380 V895 H1410" class="bi"/><text x="1290" y="920" class="flowLabel">files / cleanup</text>

  <rect x="40" y="1015" width="1720" height="55" fill="#f4f7f9" stroke="#ccd8e0" rx="8"/>
  <text x="65" y="1048" class="legend">Solid blue arrows: internal requests and persisted data flows.  Dashed amber arrows: calls to external APIs or local processing tools.  Bidirectional arrows indicate request/response or read/write flows.</text>
</svg>
